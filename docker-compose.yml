services:
  flux:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      # /data covers both project files and users.db
      - flux-data:/data
      # Persist the recents list across container restarts
      - flux-recents:/root/.flux
    environment:
      - PORT=3001
      - NODE_ENV=production
      - FLUX_PROJECTS_DIR=/data/projects
      - USERS_DB_PATH=/data/users.db
    restart: unless-stopped

volumes:
  flux-data:
  flux-recents:
